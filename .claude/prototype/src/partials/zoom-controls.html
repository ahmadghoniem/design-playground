<div class="bottom-left-wrap">
  <div class="help-wrap" data-tip-boundary @click.outside="$store.help.close()">
    <button class="help-btn" type="button" @click.stop="$store.help.toggle()" :aria-expanded="$store.help.open" aria-haspopup="true" aria-label="Help and resources" x-tip.top="$store.help.open ? '' : 'Help and resources'">?</button>
    <div data-partial="src/partials/help-pop.html"></div>
  </div>

  <div class="zoom-controls" role="group" aria-label="Zoom controls" data-tip-boundary>
    <button type="button" @click="zoomOut()" x-tip.top="'Zoom out'" aria-label="Zoom out">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <span class="zv" x-text="zoom + '%'">100%</span>
    <button type="button" @click="zoomIn()" x-tip.top="'Zoom in'" aria-label="Zoom in">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </div>
</div>
