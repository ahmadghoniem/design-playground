<aside class="library" x-data="library()">
  <div class="stack-head stack-head-left">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--pgc-muted-fg)" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="M3 8l9 5 9-5"/></svg>
    <span class="proj-name">rewynd</span>
    <div class="fold-tools">
      <button type="button" class="fold-ic" @click="$store.ui.toggleLeftFlank()"
              :aria-label="$store.ui.leftCollapsed ? 'Expand panel' : 'Collapse panel'"
              x-tip.right="$store.ui.leftCollapsed ? 'Expand panel' : 'Collapse panel'">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
      </button>
    </div>
  </div>

  <div class="library-body">
    <div class="fold-stack">
      <div class="fold" :class="{ 'fold-open': layersOpen }">
        <div class="fold-h">
          <button type="button" class="fold-toggle" x-show="!layerSearchOpen" @click="layersOpen = !layersOpen" :aria-expanded="layersOpen">
            <svg class="fold-chev" :class="{ open: layersOpen }" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
            Layers
          </button>
          <input type="text" class="fold-h-input" x-ref="layerSearch" x-show="layerSearchOpen" x-cloak
                 x-model="search" placeholder="Search layers" @keydown.escape="toggleLayerSearch()">
          <div class="fold-tools">
            <button type="button" class="fold-ic" @click.stop="toggleLayerSearch()"
                    :aria-label="layerSearchOpen ? 'Close search' : 'Search layers'">
              <svg x-show="!layerSearchOpen" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg>
              <svg x-show="layerSearchOpen" x-cloak width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>
        </div>
        <div class="fold-body" x-show="layersOpen">
          <template x-for="row in layers" :key="row.id">
            <div class="ltree-row" :class="{ sel: row.selected }" x-show="isLayerVisible(row)">
              <span class="ltree-guides">
                <template x-for="i in row.depth" :key="i">
                  <span class="ltree-guide"></span>
                </template>
              </span>
              <button type="button" class="tw" x-show="layerHasChildren(row)" @click.stop="toggleLayer(row.id)" :aria-expanded="row.expanded !== false" :aria-label="'Toggle ' + row.label">
                <svg class="chev" :class="{ open: row.expanded !== false }" width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
              </button>
              <span class="tw tw-spacer" x-show="!layerHasChildren(row)"></span>
              <span class="ic">
                <svg x-show="row.icon === 'layout'" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>
                <svg x-show="row.icon === 'layers'" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5Z"/><path d="M2 12l10 5 10-5M2 17l10 5 10-5"/></svg>
                <svg x-show="row.icon === 'box'" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="M3.3 7.3 12 12l8.7-4.7M12 22V12"/></svg>
                <svg x-show="row.icon === 'chart'" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="20" x2="4" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="20" y1="20" x2="20" y2="14"/><path d="M4 10l8-6 4 4 4-2"/></svg>
                <svg x-show="row.icon === 'table'" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
                <svg x-show="row.icon === 'primitive'" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><ellipse cx="12" cy="12" rx="9" ry="4"/><ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(120 12 12)"/></svg>
              </span>
              <span class="lbl" :class="{ dim: row.dim }" x-text="row.label"></span>
              <span class="ltree-actions">
                <button class="focus-btn" type="button" x-tip.right="'Focus on canvas'">
                  <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/></svg>
                </button>
                <button class="drag-btn" type="button" x-tip.right="'Drag to canvas'" aria-label="Drag to canvas">
                  <svg width="8" height="10" viewBox="0 0 8 10" fill="currentColor"><circle cx="2" cy="2" r="1.2"/><circle cx="6" cy="2" r="1.2"/><circle cx="2" cy="5" r="1.2"/><circle cx="6" cy="5" r="1.2"/><circle cx="2" cy="8" r="1.2"/><circle cx="6" cy="8" r="1.2"/></svg>
                </button>
              </span>
            </div>
          </template>
        </div>
      </div>

      <div class="fold" :class="{ 'fold-open': primsOpen }">
        <div class="fold-h">
          <button type="button" class="fold-toggle" x-show="!primSearchOpen" @click="primsOpen = !primsOpen" :aria-expanded="primsOpen">
            <svg class="fold-chev" :class="{ open: primsOpen }" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
            Primitives
            <span class="fold-count" x-text="primitives.length"></span>
          </button>
          <input type="text" class="fold-h-input" x-ref="primSearch" x-show="primSearchOpen" x-cloak
                 x-model="primQuery" placeholder="Search primitives" @keydown.escape="togglePrimSearch()">
          <div class="fold-tools">
            <button type="button" class="fold-ic" @click.stop="togglePrimSearch()"
                    :aria-label="primSearchOpen ? 'Close search' : 'Search primitives'">
              <svg x-show="!primSearchOpen" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg>
              <svg x-show="primSearchOpen" x-cloak width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
            <button type="button" class="fold-ic" x-show="!primSearchOpen" aria-label="Add primitive">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
        </div>
        <div class="fold-body" x-show="primsOpen">
          <template x-for="p in primitives" :key="'stack-' + p.id">
            <div x-show="matchesPrim(p.label)">
              <div class="prim-row" @click="p.cva && togglePrimitive(p.id)">
                <span class="tw" x-text="p.cva ? chevron(p) : ''"></span>
                <span class="ic"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><ellipse cx="12" cy="12" rx="9" ry="4"/><ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(120 12 12)"/></svg></span>
                <span class="lbl" x-text="p.label"></span>
              </div>
              <div x-show="p.groups && isPrimitiveExpanded(p)">
                <template x-for="g in p.groups" :key="g.label">
                  <div>
                    <div class="cva-group-lbl" x-text="g.label"></div>
                    <div class="cva-chips">
                      <template x-for="chip in g.chips" :key="chip">
                        <span class="cva-chip" :class="{ default: chip === g.defaultChip }" x-text="chip"></span>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>

  </div>

</aside>
