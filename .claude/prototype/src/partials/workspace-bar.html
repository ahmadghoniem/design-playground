<!-- Workspace switcher (variant-ws-pill.html) — workspaces without tabs. One floating
     pill names the current workspace and carries its branch + dirty state; the menu
     (click or ⌘K) holds everything tabs used to show: every workspace with its status,
     the parked stash, and creation. Same card recipe as the toolbar and flank panels. -->
<div class="ws-bar" x-data="{ wsMenu: false }"
     @click.outside="wsMenu = false"
     @keydown.escape.window="wsMenu = false"
     @keydown.window="if (($event.metaKey || $event.ctrlKey) && $event.key === 'k') { $event.preventDefault(); wsMenu = !wsMenu; }">
  <button type="button" class="ws-pill" @click="wsMenu = !wsMenu" :aria-expanded="wsMenu"
          aria-haspopup="true" x-tip.bottom="'Workspaces — ⌘K'">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
    <span class="ws-name" x-text="$store.boards.activeBoard.label"></span>
    <span class="ws-branch"><span class="gl">⑂</span><span x-text="$store.boards.activeBoard.branch"></span></span>
    <span class="ct-dirty" x-show="$store.boards.activeBoard.dirty" x-tip="'Uncommitted work on this branch'" aria-hidden="true"></span>
    <svg class="ws-chev" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
  </button>

  <div class="ct-menu ws-menu" x-show="wsMenu" x-cloak x-transition.opacity.duration.120ms>
    <div class="ct-menu-lbl">Workspaces</div>
    <template x-for="board in $store.boards.list" :key="board.id">
      <button type="button" class="ct-menu-item" @click="$store.boards.select(board.id); wsMenu = false">
        <span class="ct-check" x-show="$store.boards.active === board.id">✓</span>
        <span class="ct-check" x-show="$store.boards.active !== board.id" aria-hidden="true"></span>
        <span class="ws-row-name" x-text="board.label"></span>
        <span class="ws-row-branch"><span class="gl">⑂</span><span x-text="board.branch"></span></span>
        <span class="ct-dirty" x-show="board.dirty" aria-hidden="true"></span>
      </button>
    </template>
    <template x-if="$store.boards.stashed.length">
      <div>
        <div class="ct-menu-lbl" x-text="'Parked — ' + $store.boards.stashed.length"></div>
        <template x-for="s in $store.boards.stashed" :key="s.id">
          <button type="button" class="ct-menu-item mono" @click="$store.boards.popStash(s.id); wsMenu = false"
                  x-tip.right="'Restore this workspace'">
            <span class="gl">⑂</span><span x-text="s.branch"></span>
          </button>
        </template>
      </div>
    </template>
    <div class="ws-menu-sep"></div>
    <button type="button" class="ct-menu-item" @click="$store.boards.add(); wsMenu = false">
      <span class="ct-check" aria-hidden="true"></span>
      <span>New workspace…</span>
      <kbd class="ws-kbd">⌘K</kbd>
    </button>
    <button type="button" class="ct-menu-item" x-show="$store.boards.list.length > 1"
            @click="$store.boards.close($store.boards.active); wsMenu = false">
      <span class="ct-check" aria-hidden="true"></span>
      <span>Park this workspace</span>
    </button>
  </div>
</div>
