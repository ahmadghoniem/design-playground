<div class="canvas-toolbar" id="loc-canvas-toolbar" role="group" aria-label="Canvas tools" data-tip-boundary>
  <button type="button" @click="setTool('select')" :aria-pressed="activeTool === 'select'" x-tip.right="'Select'" data-tip-key="V" aria-label="Select tool">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3l7 17 2-7 7-2Z"/></svg>
  </button>
  <button type="button" @click="setTool('hand')" :aria-pressed="activeTool === 'hand'" x-tip.right="'Hand'" data-tip-key="H" aria-label="Hand tool">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12V6a1.5 1.5 0 0 1 3 0v5M12 11V4.5a1.5 1.5 0 0 1 3 0V11M15 11.5V6a1.5 1.5 0 0 1 3 0v9c0 4-2.5 7-6.5 7S5 18.5 5 15v-3.5A1.5 1.5 0 0 1 8 11"/></svg>
  </button>
  <button type="button" @click="setTool('shapes')" :aria-pressed="activeTool === 'shapes'" x-tip.right="'Shapes'" data-tip-key="R" aria-label="Shape tool">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="5.5"/><rect x="12" y="12" width="9" height="9" rx="1.5"/></svg>
  </button>
  <button type="button" @click="setTool('text')" :aria-pressed="activeTool === 'text'" x-tip.right="'Text'" data-tip-key="T" aria-label="Text tool">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 6 4 4 20 4 20 6"/><line x1="12" y1="4" x2="12" y2="20"/><line x1="9" y1="20" x2="15" y2="20"/></svg>
  </button>
  <button type="button" @click="setTool('image')" :aria-pressed="activeTool === 'image'" x-tip.right="'Upload image or GIF'" aria-label="Upload image or GIF">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M20 21H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2Z"/></svg>
  </button>
  <div class="rail-sep"></div>
  <button type="button" @click="undo()" x-tip.right="'Undo'" aria-label="Undo" :disabled="undone >= maxUndo">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
  </button>
  <button type="button" @click="redo()" x-tip.right="'Redo'" aria-label="Redo" :disabled="undone <= 0">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
  </button>
  <div class="rail-sep"></div>
  <div x-data="previewTheme()">
    <button type="button" @click="toggle()" x-tip.right="title" :aria-label="title">
      <svg x-show="!dark" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg x-show="dark" x-cloak width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    </button>
  </div>
</div>
