<aside class="side" x-data="sidebar()">
  <div class="side-head">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--pgc-muted-fg)"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="M3 8l9 5 9-5"/></svg>
    <span class="lbl">Project</span>
    <button class="add-btn" type="button" aria-label="Add components">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </div>

  <div class="seg-tabs" role="tablist">
    <button role="tab" type="button" @click="setTab('layers')" :aria-selected="tab === 'layers'">Layers</button>
    <button role="tab" type="button" @click="setTab('prims')" :aria-selected="tab === 'prims'">Primitives</button>
    <button role="tab" type="button" @click="setTab('tokens')" :aria-selected="tab === 'tokens'">Tokens</button>
  </div>

  <div class="side-search">
    <input type="text" x-model="search" :placeholder="searchPlaceholder">
  </div>

  <div class="side-body">
    <div x-show="tab === 'layers'">
      <template x-for="row in layers" :key="row.id">
        <div class="ltree-row" :class="{ sel: row.selected }" :style="layerPadding(row.depth)" x-show="isLayerVisible(row)">
          <span class="tw" x-text="row.expanded === false ? '▸' : (row.expanded ? '▾' : '')"></span>
          <span class="ic">
            <svg x-show="row.icon === 'branch'" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5Z"/><path d="M2 12l10 5 10-5M2 17l10 5 10-5"/></svg>
            <svg x-show="row.icon === 'leaf'" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>
          </span>
          <span class="lbl" x-text="row.label"></span>
          <span class="cnt" x-show="row.count" x-text="row.count"></span>
          <button class="focus-btn" type="button" title="Focus on canvas" x-show="row.selected">
            <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/></svg>
          </button>
        </div>
      </template>
    </div>

    <div x-show="tab === 'prims'" x-cloak>
      <template x-for="p in primitives" :key="p.id">
        <div>
          <div class="prim-row" :class="{ overlay: p.overlay }" :title="p.overlay ? 'Renders through a portal — can\'t preview inside a canvas card yet' : null" @click="p.cva && togglePrimitive(p.id)">
            <span class="tw" x-text="p.cva ? chevron(p) : ''"></span>
            <span class="ic"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><ellipse cx="12" cy="12" rx="9" ry="4"/><ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(120 12 12)"/></svg></span>
            <span class="lbl" x-text="p.label"></span>
            <span class="cva-flag" x-show="p.cva">cva</span>
            <span class="ban" x-show="p.overlay"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="5.6" y1="5.6" x2="18.4" y2="18.4"/></svg></span>
          </div>
          <div x-show="p.groups && isPrimitiveExpanded(p)">
            <template x-for="g in p.groups" :key="g.label">
              <div>
                <div class="cva-group-lbl" x-text="g.label"></div>
                <div class="cva-chips">
                  <template x-for="chip in g.chips" :key="chip">
                    <span class="cva-chip" :class="{ default: chip === g.defaultChip }" x-text="chip"></span>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>

    <div x-show="tab === 'tokens'" x-cloak>
      <div class="app-theme" id="tokenScheme">
        <template x-for="group in tokenGroups" :key="group.group">
          <div>
            <div class="tok-group-lbl" x-text="group.group"></div>
            <template x-for="row in group.rows" :key="row.name">
              <button type="button" class="tok-row" x-show="!row.undef" @click="copyToken(row.name, row.copy, row.value)">
                <span class="sw" :style="swatchStyle(row)"></span>
                <span class="name" x-text="row.name"></span>
                <span class="val" x-text="tokenValue(row)"></span>
              </button>
              <div class="tok-row undef" x-show="row.undef">
                <span class="sw undef"></span>
                <span class="name" x-text="row.name"></span>
                <span class="undef-badge"><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20Z"/><line x1="12" y1="9" x2="12" y2="14"/></svg>UNDEF</span>
              </div>
            </template>
          </div>
        </template>
      </div>
    </div>
  </div>

  <div class="side-foot"><span x-text="footHint"></span></div>
</aside>
