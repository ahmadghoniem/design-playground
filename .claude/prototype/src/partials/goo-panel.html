<div class="goo-panel" x-data="gooPanel()" x-cloak>
  <button type="button" class="goo-panel-toggle" @click="toggle()" aria-label="Goo settings">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
  </button>

  <div class="goo-panel-card" x-show="open" x-cloak>
    <div class="goo-panel-head">
      <span class="goo-panel-title">goo</span>
      <label class="goo-panel-switch">
        <input type="checkbox" x-model="$store.goo.enabled" @change="$store.goo.apply()">
        <span x-text="$store.goo.enabled ? 'on' : 'off'"></span>
      </label>
      <button type="button" class="goo-panel-chevron" @click="toggle()" aria-label="Collapse">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>

    <div class="goo-panel-body">
      <label class="goo-panel-row goo-panel-row-bool">
        <span>anchor</span>
        <input type="checkbox" x-model="$store.goo.anchor" @change="$store.goo.apply()">
      </label>

      <template x-for="field in fields" :key="field.key">
        <label class="goo-panel-row">
          <span x-text="field.label"></span>
          <input type="range"
                 :min="field.min" :max="field.max" :step="field.step"
                 x-model.number="$store.goo[field.key]"
                 @input="onFieldInput()">
          <output class="goo-panel-val" x-text="$store.goo[field.key]"></output>
        </label>
      </template>
    </div>

    <div class="goo-panel-foot">
      <button type="button" @click="reset()">Reset</button>
      <button type="button" @click="copyCss()" x-text="copied ? 'Copied' : 'Copy CSS'"></button>
    </div>
  </div>
</div>
