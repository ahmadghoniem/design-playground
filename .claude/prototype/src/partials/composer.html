<div class="composer" x-data="composer()" @click.outside="closeMenu(); closeSkillPicker()">
  <div class="chat-box" :class="{ resizing: $store.chat.resizing }">
    <div class="composer-grip" x-show="$store.chat.isComposerDocked"
         @pointerdown="resizeStart($event)" @dblclick="resizeReset()"
         role="separator" aria-label="Resize composer"
         x-tip.right="'Drag to resize · double-click to reset'">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M1.5 13.5A12 12 0 0 1 13.5 1.5"/></svg>
    </div>

    <div class="composer-ask" x-show="$store.chat.isComposerDocked">
      <div class="ask-rest" x-show="$store.chat.askDone" x-cloak x-text="$store.chat.askAnsweredLabel"></div>

      <template x-if="!$store.chat.askDone">
        <div class="ask-turn">
          <div class="ask-head">
            <span class="ask-title" x-text="$store.chat.askQuestion.title"></span>
            <span class="ask-meta" x-show="$store.lab.questionLayout === 'condensed'">
              <span class="ask-count" x-text="$store.chat.askCounterLabel"></span>
              <button type="button" class="ask-skip" @click="$store.chat.skipQuestion()">Skip</button>
            </span>
            <button type="button" class="ask-dismiss" x-show="$store.lab.questionLayout === 'full'" x-cloak
                    @click="$store.chat.skipQuestion()" aria-label="Dismiss question">×</button>
          </div>

          <div class="ask-options">
            <template x-for="option in $store.chat.askQuestion.options" :key="option">
              <button type="button" class="ask-option" @click="$store.chat.answerQuestion(option)">
                <span class="ask-mark" aria-hidden="true"></span>
                <span class="ask-label" x-text="option"></span>
              </button>
            </template>
          </div>

          <div class="ask-foot" x-show="$store.lab.questionLayout === 'full'" x-cloak>
            <span class="ask-count" x-text="$store.chat.askCounterLabel"></span>
            <button type="button" class="ask-skip" @click="$store.chat.skipQuestion()">Skip</button>
          </div>
        </div>
      </template>
    </div>

    <div class="composer-body">
      <button type="button" class="composer-expand"
              @click="$store.chat.toggleExpanded()"
              :aria-pressed="$store.chat.isComposerEmbedded"
              x-tip.top="$store.chat.isComposerEmbedded ? 'Collapse to canvas' : 'Expand into Agents'">
        <svg x-show="!$store.chat.isComposerEmbedded" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
        <svg x-show="$store.chat.isComposerEmbedded" x-cloak width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6"/><path d="M20 10h-6V4"/><path d="M14 10l7-7"/><path d="M3 21l7-7"/></svg>
      </button>

      <div class="composer-section attachments-section" x-show="$store.chat.tags.length">
        <div class="chat-tags">
          <template x-for="tag in $store.chat.tags" :key="tag.id">
            <span class="tag" :class="{ 'n-comp': tag.type === 'comp', 'n-text': tag.type === 'text', 'n-img': tag.type === 'img' }">
              <i>
                <svg x-show="tag.type === 'comp'" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
                <svg x-show="tag.type === 'text'" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 6 4 4 20 4 20 6"/><line x1="12" y1="4" x2="12" y2="20"/><line x1="9" y1="20" x2="15" y2="20"/></svg>
                <svg x-show="tag.type === 'img'" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="1.8"/><path d="M21 15l-5-5L5 21"/></svg>
              </i><span x-text="tag.label"></span><button type="button" @click="$store.chat.removeTag(tag.id)" aria-label="Remove">×</button>
            </span>
          </template>
        </div>
      </div>

      <div class="composer-input-area">
        <div class="skill-picker" x-show="skillPickerOpen" x-transition x-cloak @mousedown.prevent>
          <div class="skill-picker-group">Skills</div>
          <div class="skill-picker-list">
            <template x-for="(item, index) in visibleSkills" :key="item.id">
              <button type="button" class="skill-picker-row"
                      :class="{ on: skillHighlight === index }"
                      @mouseenter="onSkillHover(index)"
                      @click="pickSkill(index)">
                <span class="skill-label" x-text="item.label"></span>
                <span class="skill-desc" x-show="item.description" x-text="item.description"></span>
              </button>
            </template>
          </div>
        </div>
        <textarea class="chat-input" x-model="$store.chat.draft" rows="1"
                  placeholder="Vary this, ask a question, / for skills, @ to tag a node"
                  @input="onInput($event)" @keydown="onInputKeydown($event)" x-init="growInput($el)"></textarea>
      </div>

      <div class="composer-footer">
        <div class="composer-footer-left">
          <button type="button" class="annot-btn" @click="$store.chat.bumpAnnotations()"
                  :aria-label="$store.chat.annotationsAriaLabel"
                  x-tip.top="$store.chat.annotationsTipLabel"
                  :data-tip-desc="$store.chat.annotationsTipDesc"
                  :data-tip-art="$store.chat.annotationsTipArt">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square">
              <path d="M11.875 16.375L15.464 12.786C15.594 12.656 15.544 12.435 15.3709 12.3736L4.24478 8.42557C4.04643 8.35519 3.85518 8.54643 3.92557 8.74478L7.87354 19.8709C7.93499 20.044 8.15599 20.094 8.28593 19.964L11.875 16.375ZM11.875 16.375L16.75 21.25"/>
              <path d="M20.25 3.75H10.75"/>
              <path d="M20.25 7.75H15.75"/>
            </svg>
            <span class="annot-badge" x-show="$store.chat.annotations > 0" x-text="$store.chat.annotations"></span>
          </button>

          <div class="ctx-pop-wrap">
            <button type="button" class="perm-pill" :class="'tone-' + $store.chat.permissionTone"
                    @click="toggleMenu('perm')"
                    :aria-label="'Approval mode: ' + $store.chat.permissionHint"
                    x-tip.top="menu === 'perm' ? '' : $store.chat.permissionHint">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11M12 10V4a1.5 1.5 0 0 1 3 0v7M15 11V6a1.5 1.5 0 0 1 3 0v8a6 6 0 0 1-6 6h-1.5a5 5 0 0 1-3.6-1.5L4 15.5a1.5 1.5 0 0 1 2.3-1.9L9 16"/></svg>
              <span x-text="$store.chat.permissionLabel"></span><span class="chev">⌄</span>
            </button>
            <div class="ctx-menu up perm-menu" x-show="menu === 'perm'" x-transition x-cloak>
              <template x-for="p in permissions" :key="p.id">
                <button type="button" :class="{ on: p.id === $store.chat.permission }" @click="pickPermission(p.id)">
                  <span class="pm-l" x-text="p.label"></span><span class="pm-h" x-text="p.hint"></span>
                </button>
              </template>
            </div>
          </div>
        </div>

        <div class="composer-footer-right">
          <div class="ctx-pop-wrap model-picker-wrap">
            <button type="button" class="model-pill" @click="toggleMenu('model')"
                    x-tip.top="menu === 'model' ? '' : 'Select model'"
                    :class="{ open: menu === 'model' }">
              <span class="mp-seg mp-seg-model">
                <span class="agent-mark" aria-hidden="true"></span>
                <span x-text="$store.chat.modelLabel"></span>
              </span>
              <span class="mp-split" aria-hidden="true"></span>
              <span class="mp-seg mp-seg-state">
                <span class="effort-dim" x-text="$store.chat.effortLabel"></span>
                <span class="fast-mark" x-show="$store.chat.fast" x-cloak>Fast</span>
                <span class="chev">⌄</span>
              </span>
            </button>
            <div class="ctx-menu up right model-menu" x-show="menu === 'model'" x-transition x-cloak>
              <div class="model-menu-row" @mouseenter="openSubmenu('model', $event)" @click="openSubmenu('model', $event)">
                <span class="mm-label">Model</span>
                <span class="mm-value" x-text="$store.chat.modelLabel"></span>
                <span class="mm-chev">›</span>
                <div class="ctx-submenu model-submenu" :class="{ flip: submenuFlip }" x-show="submenu === 'model'" x-cloak @click.stop>
                  <input type="search" class="mm-search" x-model="modelQuery" placeholder="Search models" aria-label="Search models">
                  <template x-for="agent in $store.chat.agents" :key="agent.id">
                    <div class="mm-group" x-show="agentHasMatch(agent)">
                      <div class="mm-group-lbl" x-text="agent.name"></div>
                      <template x-for="m in agent.models" :key="m.id">
                        <button type="button" x-show="matchesModel(m)" :class="{ on: m.id === $store.chat.model }" @click="pickModel(m.id)">
                          <span class="mm-opt" x-text="m.label"></span>
                          <span class="effort-dim" x-text="$store.chat.effortLabelFor(m.effort)"></span>
                          <span class="mm-check" x-show="m.id === $store.chat.model">✓</span>
                        </button>
                      </template>
                    </div>
                  </template>
                </div>
              </div>
              <div class="model-menu-row" @mouseenter="openSubmenu('effort', $event)" @click="openSubmenu('effort', $event)">
                <span class="mm-label">Effort</span>
                <span class="mm-value" x-text="$store.chat.effortLabel"></span>
                <span class="mm-chev">›</span>
                <div class="ctx-submenu effort-submenu" :class="{ flip: submenuFlip }" x-show="submenu === 'effort'" x-cloak @click.stop>
                  <template x-for="e in $store.chat.availableEfforts" :key="e.id">
                    <button type="button" :class="{ on: e.id === $store.chat.effort }" @click="pickEffort(e.id)">
                      <span class="mm-opt" x-text="e.label"></span>
                      <span class="mm-default" x-show="e.id === $store.chat.modelDefaultEffort" x-cloak>(default)</span>
                      <span class="mm-check" x-show="e.id === $store.chat.effort">✓</span>
                    </button>
                  </template>
                </div>
              </div>
              <div class="mm-group-lbl mm-section">Options</div>
              <button type="button" class="model-menu-row model-menu-switch"
                      role="switch"
                      :aria-checked="$store.chat.fast ? 'true' : 'false'"
                      :aria-disabled="!$store.chat.fastSupported ? 'true' : 'false'"
                      x-tip.top="$store.chat.fastHint"
                      :aria-label="'Fast mode. ' + $store.chat.fastHint"
                      @click="$store.chat.toggleFast()">
                <span class="mm-label">Fast</span>
                <span class="mm-switch" :class="{ on: $store.chat.fast }" aria-hidden="true"><span class="mm-knob"></span></span>
              </button>
              <div class="ctx-menu-divider"></div>
              <button type="button" class="model-menu-action" @click="openModelSettings()">Model settings</button>
            </div>
          </div>
          <button type="button" class="send" aria-label="Send">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="6 11 12 5 18 11"/></svg>
          </button>
        </div>
      </div>

      <button type="button" class="composer-hem" x-show="$store.chat.isComposerDocked"
              @click="$store.chat.toggleStrip()"
              :aria-expanded="$store.chat.stripOpen"
              :aria-label="$store.chat.stripOpen ? 'Collapse worktree strip' : 'Show worktree strip'"
              x-tip.top="$store.chat.stripOpen ? 'Collapse' : 'Show worktree'"></button>
    </div>

    <div class="composer-strip" x-show="$store.chat.isComposerDocked && $store.chat.stripOpen">
      <div class="strip-where">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
        <span class="strip-wt" x-text="$store.chat.worktree"></span>
        <span class="gl">⑂</span>
        <span class="strip-branch" x-text="$store.chat.branch"></span>
      </div>
      <div class="strip-diff" x-show="$store.chat.hasChanges">
        <span class="add" x-text="$store.chat.linesAddedLabel"></span>
        <span class="del" x-text="$store.chat.linesRemovedLabel"></span>
      </div>
    </div>
  </div>
</div>
