<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>design-playground — Flow Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    /* workshop schematic — mid-tone warm charcoal, paper text, verdigris current */
    --bg:#2e2b27; --bg2:#33302b; --surface:#3a3630; --surface2:#423d36;
    --border:#4d473f; --border2:#5c554b;
    --text:#ede6da; --muted:#a89e90; --faint:#7d7468;
    --current:#7fc4b0; --brass:#d9b36a; --brass-ink:#2a2621;
    --c-actor:#b3a3e3; --c-ui:#8fb8e8; --c-client:#93c7a2;
    --c-shared:#db9bb8; --c-server:#d9b36a; --c-external:#de9a8a;
    --display:'Bricolage Grotesque',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
    --sans:system-ui,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font:14px/1.55 var(--sans);display:flex;flex-direction:column;overflow:hidden}
  :focus-visible{outline:2px solid var(--current);outline-offset:2px;border-radius:4px}

  /* ---------- header: brand + toggle only ---------- */
  header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg2)}
  .brand{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
  .brand em{font-style:normal;color:var(--current)}
  .brand .meta{font-family:var(--mono);font-size:10.5px;font-weight:400;color:var(--faint);margin-left:12px;letter-spacing:.04em}
  .viewtoggle{display:flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;margin-left:auto;background:var(--bg)}
  .viewtoggle button{background:transparent;border:none;color:var(--muted);font:600 12px var(--mono);letter-spacing:.02em;padding:8px 16px;cursor:pointer;transition:.15s}
  .viewtoggle button.active{background:var(--surface2);color:var(--current)}
  .viewtoggle button:not(.active):hover{color:var(--text)}

  /* ---------- layout ---------- */
  .main{display:flex;flex:1;min-height:0}
  nav{width:252px;flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto;padding:14px 10px;background:var(--bg2)}
  nav .cat{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--faint);font-weight:500;margin:16px 10px 6px;display:flex;align-items:center;gap:8px}
  nav .cat::after{content:'';flex:1;height:1px;background:var(--border)}
  nav .cat:first-child{margin-top:2px}
  nav button.flow{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;color:var(--text);font:13px var(--sans);padding:7px 10px;cursor:pointer;transition:.12s}
  nav button.flow .wdot{width:6px;height:6px;border-radius:50%;background:var(--border2);flex-shrink:0;transition:.15s}
  nav button.flow:hover{background:var(--surface)}
  nav button.flow.active{background:var(--surface2);border-color:var(--border2);font-weight:600}
  nav button.flow.active .wdot{background:var(--current);box-shadow:0 0 8px var(--current)}
  .content{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}

  /* ---------- map view ---------- */
  #mapView{flex:1;display:flex;min-height:0}
  .mapwrap{flex:1;min-width:0;position:relative;overflow:auto;padding:26px;
    background-image:radial-gradient(circle, #3a362f 1px, transparent 1px);background-size:26px 26px}
  #board{position:relative;display:grid;gap:30px;align-items:start;min-width:880px}
  #edgeSvg{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:5}
  .col{display:flex;flex-direction:column;gap:11px;min-width:150px}
  .colhead{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:500;padding:0 2px 5px;border-bottom:1px solid var(--border);margin-bottom:3px}
  .pkg{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 12px;transition:opacity .25s,border-color .25s,box-shadow .25s;position:relative;z-index:2}
  .pkg .plabel{font-weight:650;font-size:13px;display:flex;align-items:center;gap:8px}
  .pkg .pdot{width:7px;height:7px;border-radius:2px;transform:rotate(45deg);flex-shrink:0}
  .pkg .pdir{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:3px;word-break:break-all}
  .pkg .pdesc{font-size:11px;color:var(--muted);margin-top:3px;display:none}
  .pkg:hover .pdesc{display:block}
  #board.hasflow .pkg{opacity:.16}
  #board.hasflow .pkg.lit{opacity:1;border-color:var(--pcol,var(--current));box-shadow:0 0 0 1px var(--pcol,var(--current)),0 8px 24px -10px rgba(0,0,0,.55)}

  /* circuit traces */
  path.edge{fill:none;stroke:var(--current);stroke-width:2;stroke-linejoin:round;stroke-dasharray:7 5}
  @keyframes current{to{stroke-dashoffset:-24}}
  path.edge{animation:current 1.1s linear infinite}
  path.edge.ret{stroke:var(--faint);stroke-dasharray:3 6;animation-duration:1.8s}
  path.edge.dim{opacity:.14}
  @media (prefers-reduced-motion: reduce){ path.edge{animation:none} }
  circle.solder{fill:var(--brass);stroke:var(--bg);stroke-width:2}
  text.soldern{font:700 10px var(--mono);fill:var(--brass-ink)}

  /* ---------- signal log (right panel) ---------- */
  .steps{width:352px;flex-shrink:0;border-left:1px solid var(--border);overflow-y:auto;padding:18px;background:var(--bg2)}
  .steps h2{font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:-.01em}
  .steps .summary{font-size:12.5px;color:var(--muted);margin:6px 0 14px;padding-bottom:13px;border-bottom:1px solid var(--border)}
  .step{border:1px solid var(--border);border-radius:9px;padding:9px 12px;margin-bottom:8px;transition:.15s;background:var(--surface)}
  .step.hover,.step:hover{border-color:var(--current)}
  .step .shead{display:flex;align-items:baseline;gap:8px;font-size:12.5px;font-weight:600}
  .step .snum{font:700 10.5px var(--mono);color:var(--brass-ink);background:var(--brass);border-radius:50%;width:17px;height:17px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transform:translateY(2px)}
  .step .sarrow{color:var(--faint);font-weight:400}
  .step .slabel{font-size:12px;margin-top:4px}
  .step .spasses{font-size:11.5px;color:var(--muted);margin-top:5px;padding-left:10px;border-left:2px solid var(--border2)}
  .step .spasses b{color:var(--current);font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.06em}
  .empty{color:var(--muted);font-size:13.5px;padding:44px 30px;text-align:center;flex:1}
  .empty b{font-family:var(--display);color:var(--text)}

  /* suggested improvement card */
  .improve{margin-top:16px;border:1px dashed var(--brass);border-radius:10px;padding:11px 13px;background:rgba(217,179,106,.06)}
  .improve .ilabel{font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--brass);display:flex;align-items:center;gap:7px;margin-bottom:6px}
  .improve .ilabel::before{content:'◇'}
  .improve p{font-size:12.5px;color:var(--text)}

  /* ---------- trace view ---------- */
  #traceView{flex:1;overflow-y:auto;padding:30px 38px;display:none;
    background-image:radial-gradient(circle, #3a362f 1px, transparent 1px);background-size:26px 26px}
  .tracehead{max-width:840px;margin:0 auto 20px}
  .tracehead h2{font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:-.015em}
  .tracehead p{color:var(--muted);font-size:13px;margin-top:5px;max-width:640px}
  .tracehead .improve{max-width:640px}
  .trace{max-width:840px;margin:0 auto;position:relative;padding-left:38px}
  .trace::before{content:'';position:absolute;left:14px;top:16px;bottom:16px;width:2px;background:repeating-linear-gradient(to bottom,var(--border2) 0 7px,transparent 7px 12px)}
  .titem{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 15px;margin-bottom:10px}
  .titem::before{content:attr(data-n);position:absolute;left:-38px;top:9px;width:28px;height:28px;border-radius:50%;background:var(--bg2);border:2px solid var(--tcol,var(--border2));color:var(--text);font:700 11px var(--mono);display:flex;align-items:center;justify-content:center}
  .titem .tfile{font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--tcol,var(--text));word-break:break-all}
  .titem .tpkg{font:500 9.5px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);float:right;margin-left:10px;border:1px solid var(--border);border-radius:999px;padding:1px 8px}
  .titem .trole{font-size:12.5px;margin-top:4px}
  .titem .tdetail{font-size:11.5px;color:var(--muted);margin-top:3px}

  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:5px}
  ::-webkit-scrollbar-track{background:transparent}
  @media (max-width:900px){ nav{width:200px} .steps{width:280px} }
</style>
</head>
<body>
<header>
  <div class="brand">design-playground <em>flow explorer</em><span class="meta" id="metaCounts"></span></div>
  <div class="viewtoggle" role="tablist">
    <button id="btnMap" class="active" role="tab" aria-selected="true">SUBSYSTEM MAP</button>
    <button id="btnTrace" role="tab" aria-selected="false">FILE TRACE A→Z</button>
  </div>
</header>
<div class="main">
  <nav id="nav" aria-label="Flows"></nav>
  <div class="content">
    <div id="mapView">
      <div class="mapwrap">
        <div id="board">
          <svg id="edgeSvg"><g id="edgeG"></g></svg>
        </div>
      </div>
      <aside class="steps" id="stepsPanel">
        <div class="empty"><b>Pick a flow.</b><br>Its signal path lights up on the board; each hop shows what gets passed. Use ↑/↓ to move between flows.</div>
      </aside>
    </div>
    <div id="traceView"><div class="empty"><b>Pick a flow.</b><br>Every file executed, in order, gesture to completion.</div></div>
  </div>
</div>

<script src="flows.data.js"></script>
<script>
(function(){
  const F = window.FLOWS;
  if(!F){ document.body.innerHTML = '<div class="empty">flows.data.js failed to load — it must sit next to this file.</div>'; return; }

  const groupColor = {}; F.groups.forEach(g => groupColor[g.id] = g.color);
  const pkgById = {}; F.packages.forEach(p => pkgById[p.id] = p);
  const pcol = p => groupColor[p.group] || 'var(--current)';
  document.getElementById('metaCounts').textContent =
    `${F.flows.length} flows · ${F.packages.length} packages`;

  // ---------- board ----------
  const board = document.getElementById('board');
  board.style.gridTemplateColumns = `repeat(${F.groups.length}, minmax(150px,1fr))`;
  const pkgEl = {};
  F.groups.forEach(g => {
    const col = document.createElement('div');
    col.className = 'col';
    col.innerHTML = `<div class="colhead" style="color:${g.color}">${g.label}</div>`;
    F.packages.filter(p => p.group === g.id).forEach(p => {
      const el = document.createElement('div');
      el.className = 'pkg'; el.id = 'pkg-' + p.id;
      el.style.setProperty('--pcol', pcol(p));
      el.innerHTML = `<div class="plabel"><span class="pdot" style="background:${pcol(p)}"></span>${p.label}</div>` +
        (p.dir ? `<div class="pdir">${p.dir}</div>` : '') +
        (p.desc ? `<div class="pdesc">${p.desc}</div>` : '');
      col.appendChild(el); pkgEl[p.id] = el;
    });
    board.appendChild(col);
  });

  // ---------- nav ----------
  const nav = document.getElementById('nav');
  const cats = [...new Set(F.flows.map(f => f.category))];
  const flowBtns = {};
  const flowOrder = [];
  cats.forEach(c => {
    const h = document.createElement('div'); h.className = 'cat'; h.textContent = c; nav.appendChild(h);
    F.flows.filter(f => f.category === c).forEach(f => {
      const b = document.createElement('button');
      b.className = 'flow'; b.innerHTML = `<span class="wdot"></span>${f.title}`;
      b.onclick = () => selectFlow(f.id);
      nav.appendChild(b); flowBtns[f.id] = b; flowOrder.push(f.id);
    });
  });

  // ---------- views ----------
  const mapView = document.getElementById('mapView'), traceView = document.getElementById('traceView');
  const btnMap = document.getElementById('btnMap'), btnTrace = document.getElementById('btnTrace');
  let view = 'map';
  function setView(v){
    view = v;
    btnMap.classList.toggle('active', v === 'map');
    btnTrace.classList.toggle('active', v === 'trace');
    btnMap.setAttribute('aria-selected', v === 'map');
    btnTrace.setAttribute('aria-selected', v === 'trace');
    mapView.style.display = v === 'map' ? 'flex' : 'none';
    traceView.style.display = v === 'trace' ? 'block' : 'none';
    if(v === 'map') requestAnimationFrame(drawEdges);
  }
  btnMap.onclick = () => setView('map');
  btnTrace.onclick = () => setView('trace');

  // ---------- selection ----------
  let active = null;
  function selectFlow(id){
    active = F.flows.find(f => f.id === id) || null;
    Object.entries(flowBtns).forEach(([fid, b]) => b.classList.toggle('active', fid === id));
    renderMap(); renderTrace();
    location.hash = id;
  }
  // keyboard: arrows step through flows
  document.addEventListener('keydown', e => {
    if(e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    if(/input|textarea/i.test(document.activeElement.tagName)) return;
    e.preventDefault();
    const i = active ? flowOrder.indexOf(active.id) : -1;
    const n = e.key === 'ArrowDown' ? Math.min(i + 1, flowOrder.length - 1) : Math.max(i - 1, 0);
    selectFlow(flowOrder[n]);
    flowBtns[flowOrder[n]].scrollIntoView({block: 'nearest'});
  });

  function improveCard(f){
    return f.improve ? `<div class="improve"><div class="ilabel">Suggested improvement</div><p>${f.improve}</p></div>` : '';
  }

  // ---------- map render ----------
  const stepsPanel = document.getElementById('stepsPanel');
  function renderMap(){
    board.classList.toggle('hasflow', !!active);
    Object.values(pkgEl).forEach(el => el.classList.remove('lit'));
    if(active){
      active.steps.forEach(s => {
        pkgEl[s.from] && pkgEl[s.from].classList.add('lit');
        pkgEl[s.to] && pkgEl[s.to].classList.add('lit');
      });
      stepsPanel.innerHTML = `<h2>${active.title}</h2><div class="summary">${active.summary}</div>` +
        active.steps.map((s, i) => {
          const fp = pkgById[s.from], tp = pkgById[s.to];
          return `<div class="step" data-i="${i}">
            <div class="shead"><span class="snum">${i + 1}</span>
              <span style="color:${fp ? pcol(fp) : ''}">${fp ? fp.label : s.from}</span>
              <span class="sarrow">→</span>
              <span style="color:${tp ? pcol(tp) : ''}">${tp ? tp.label : s.to}</span></div>
            ${s.label ? `<div class="slabel">${s.label}</div>` : ''}
            ${s.passes ? `<div class="spasses"><b>passes</b> ${s.passes}</div>` : ''}
          </div>`;
        }).join('') + improveCard(active);
      stepsPanel.querySelectorAll('.step').forEach(el => {
        el.addEventListener('mouseenter', () => highlightEdge(+el.dataset.i));
        el.addEventListener('mouseleave', () => highlightEdge(-1));
      });
    } else {
      stepsPanel.innerHTML = '<div class="empty"><b>Pick a flow.</b><br>Its signal path lights up on the board.</div>';
    }
    requestAnimationFrame(drawEdges);
  }

  // ---------- circuit traces (orthogonal, rounded elbows) ----------
  const svg = document.getElementById('edgeSvg'), edgeG = document.getElementById('edgeG');
  let edgePaths = [];
  function rect(el){
    const b = el.getBoundingClientRect(), r = board.getBoundingClientRect();
    return { x: b.left - r.left, y: b.top - r.top, w: b.width, h: b.height,
             cx: b.left - r.left + b.width / 2, cy: b.top - r.top + b.height / 2 };
  }
  // rounded orthogonal path through points
  function elbow(pts, r){
    let d = `M${pts[0].x},${pts[0].y}`;
    for(let i = 1; i < pts.length - 1; i++){
      const p = pts[i], a = pts[i - 1], b = pts[i + 1];
      const da = Math.hypot(p.x - a.x, p.y - a.y), db = Math.hypot(b.x - p.x, b.y - p.y);
      const rr = Math.min(r, da / 2, db / 2);
      const ax = p.x - Math.sign(p.x - a.x) * rr, ay = p.y - Math.sign(p.y - a.y) * rr;
      const bx = p.x + Math.sign(b.x - p.x) * rr, by = p.y + Math.sign(b.y - p.y) * rr;
      d += ` L${ax},${ay} Q${p.x},${p.y} ${bx},${by}`;
    }
    const last = pts[pts.length - 1];
    d += ` L${last.x},${last.y}`;
    return d;
  }
  function drawEdges(){
    edgeG.innerHTML = ''; edgePaths = [];
    svg.setAttribute('width', board.scrollWidth); svg.setAttribute('height', board.scrollHeight);
    if(!active) return;
    const seen = {};
    active.steps.forEach((s, i) => {
      const a = pkgEl[s.from], b = pkgEl[s.to];
      if(!a || !b) return;
      const ra = rect(a), rb = rect(b);
      const key = [s.from, s.to].sort().join('|');
      const n = (seen[key] = (seen[key] || 0) + 1);
      const isRet = s.kind === 'return';
      let pts;
      if(Math.abs(ra.cx - rb.cx) < 40){           // same column: loop out right
        const loop = 44 + n * 16;
        pts = [{x: ra.x + ra.w, y: ra.cy}, {x: ra.x + ra.w + loop, y: ra.cy},
               {x: ra.x + ra.w + loop, y: rb.cy}, {x: rb.x + rb.w, y: rb.cy}];
      } else if(rb.cx > ra.cx){                    // forward
        const midX = (ra.x + ra.w + rb.x) / 2 + (n - 1) * 15;
        pts = [{x: ra.x + ra.w, y: ra.cy}, {x: midX, y: ra.cy}, {x: midX, y: rb.cy}, {x: rb.x, y: rb.cy}];
      } else {                                     // backward
        const midX = (rb.x + rb.w + ra.x) / 2 - (n - 1) * 15;
        pts = [{x: ra.x, y: ra.cy}, {x: midX, y: ra.cy}, {x: midX, y: rb.cy}, {x: rb.x + rb.w, y: rb.cy}];
      }
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', elbow(pts, 9));
      p.setAttribute('class', 'edge' + (isRet ? ' ret' : ''));
      edgeG.appendChild(p);
      const pt = p.getPointAtLength(p.getTotalLength() * .5);
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', pt.x); c.setAttribute('cy', pt.y); c.setAttribute('r', 9.5);
      c.setAttribute('class', 'solder');
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', pt.x); t.setAttribute('y', pt.y + 3.5); t.setAttribute('text-anchor', 'middle');
      t.setAttribute('class', 'soldern'); t.textContent = i + 1;
      edgeG.appendChild(c); edgeG.appendChild(t);
      edgePaths.push({p, c, t});
    });
  }
  function highlightEdge(idx){
    edgePaths.forEach((e, i) => {
      e.p.classList.toggle('dim', idx >= 0 && i !== idx);
      e.c.style.opacity = e.t.style.opacity = (idx >= 0 && i !== idx) ? .14 : 1;
    });
    stepsPanel.querySelectorAll('.step').forEach((el, i) => el.classList.toggle('hover', i === idx));
  }
  window.addEventListener('resize', () => { if(view === 'map') drawEdges(); });

  // ---------- trace render ----------
  function renderTrace(){
    if(!active){ traceView.innerHTML = '<div class="empty"><b>Pick a flow.</b><br>Every file executed, in order.</div>'; return; }
    traceView.innerHTML =
      `<div class="tracehead"><h2>${active.title}</h2><p>${active.summary}</p>${improveCard(active)}</div>` +
      `<div class="trace">` +
      active.trace.map((t, i) => {
        const p = t.pkg ? pkgById[t.pkg] : null;
        const col = p ? pcol(p) : 'var(--border2)';
        return `<div class="titem" data-n="${i + 1}" style="--tcol:${col}">
          ${p ? `<span class="tpkg" style="color:${col};border-color:${col}">${p.label}</span>` : ''}
          <div class="tfile">${t.file}</div>
          <div class="trole">${t.role}</div>
          ${t.detail ? `<div class="tdetail">${t.detail}</div>` : ''}
        </div>`;
      }).join('') + `</div>`;
  }

  const h = location.hash.slice(1);
  if(h && F.flows.some(f => f.id === h)) selectFlow(h);
})();
</script>
</body>
</html>
